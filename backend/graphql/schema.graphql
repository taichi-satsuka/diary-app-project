scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

enum Visibility {
    public
    followers
}

type User {
    id: ID!
    name: String!
    email: String!
    bio: String
    profile_image_url: String 
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!

    posts: [Post!]! @hasMany
    comments: [Comment!]! @hasMany

    followings: [User!]! @belongsToMany(relation: "followings")
    followers: [User!]! @belongsToMany(relation: "followers")

    likedPosts: [Post!]! @belongsToMany(relation: "likedPosts")
}

type Post {
    id: ID!
    user_id: ID!
    title: String!
    content: String!
    visibility: Visibility!
    created_at: DateTime!
    updated_at: DateTime!

    user: User! @belongsTo
    comments: [Comment!]! @hasMany
    likedByUsers: [User!]! @belongsToMany(relation: "likedByUsers")
}

type Comment {
    id: ID!
    user_id: ID!
    post_id: ID!
    content: String!
    created_at: DateTime!
    updated_at: DateTime!

    user: User! @belongsTo
    post: Post! @belongsTo
}

type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    
    post (id: ID @eq): Post @find
    
}

input RegisterInput {
    name: String!
    email: String!
    password: String!
    password_confirmation: String!
}

input LoginInput {
    email: String!
    password: String!
}

type AuthPayload {
    success: Boolean!
    message: String!
    user: User
    token: String
}

type Mutation {
    register(input: RegisterInput!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Register")
    login(input: LoginInput!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Login")
}

