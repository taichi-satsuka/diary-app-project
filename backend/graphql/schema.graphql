scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

enum Visibility {
    PUBLIC
    FOLLOWERS
}

type User {
    id: ID!
    name: String!
    email: String!
    bio: String
    profile_image_url: String 
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!

    posts: [Post!]! @field(resolver:  "App\\GraphQL\\Queries\\UserResolver@posts")
    comments: [Comment!]! @hasMany  "App\\GraphQL\\Queries\\UserResolver@likedPosts"

    followings: [User!]! @belongsToMany(relation: "followings")
    followers: [User!]! @belongsToMany(relation: "followers")

    likedPosts: [Post!]! @field(resolver: "App\\GraphQL\\Queries\\UserResolver@likedPosts")
}

type Post {
    id: ID!
    user_id: ID!
    title: String!
    content: String!
    visibility: Visibility!
    created_at: DateTime!
    updated_at: DateTime!

    user: User! @belongsTo
    comments: [Comment!]! @hasMany
    likedByUsers: [User!]! @belongsToMany(relation: "likedByUsers")
}

type Comment {
    id: ID!
    user_id: ID!
    post_id: ID!
    content: String!
    created_at: DateTime!
    updated_at: DateTime!

    user: User! @belongsTo
    post: Post! @belongsTo
}

interface Payload {
    success: Boolean!,
    message: String!
}

input RegisterInput {
    name: String!
    email: String!
    password: String!
    password_confirmation: String!
}

input LoginInput {
    email: String!
    password: String!
}

type AuthPayload implements Payload {
    success: Boolean!
    message: String!
    user: User
    token: String
}

input UpdateMeInput {
    name: String
    bio: String
    profile_image_url: String
}

type UpdateMePayload implements Payload {
    success: Boolean!
    message: String!
    user: User
}

type PostPayload implements Payload {
    success: Boolean!
    message: String!
    post: Post
}

input CreatePostInput {
    title: String!
    content: String!
    visibility: Visibility!
}

input UpdatePostInput {
    id: ID!
    title: String
    content: String
    visibility: Visibility
}

type TogglePayload implements Payload {
    success: Boolean!
    message: String!
}

type CommentPayload implements Payload {
    success: Boolean!
    message: String!
    comment: Comment
}

input CreateCommentInput {
    post_id: ID!
    content: String!
}


type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    
}

extend type Query @guard {
    me: User @auth
    post (id: ID @eq): Post @find
    posts: [Post!]! @field(resolver: "App\\GraphQL\\Queries\\PostResolver")
}

type Mutation {
    register(input: RegisterInput!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Auth\\Register")
    login(input: LoginInput!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Auth\\Login")
}

extend type Mutation @guard {
    logout: AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Auth\\Logout")

    updateMe(input: UpdateMeInput!): UpdateMePayload! @field(resolver: "App\\GraphQL\\Mutations\\User\\UpdateMe")
    deleteMe: UpdateMePayload! @field(resolver: "App\\GraphQL\\Mutations\\User\\DeleteMe")
    
    createPost(input: CreatePostInput!): PostPayload! @field(resolver: "App\\GraphQL\\Mutations\\Post\\CreatePost")
    updatePost(input: UpdatePostInput!): PostPayload! @field(resolver: "App\\GraphQL\\Mutations\\Post\\UpdatePost")
    deletePost(post_id: ID!): PostPayload! @field(resolver: "App\\GraphQL\\Mutations\\Post\\DeletePost")

    toggleLike(post_id: ID!): TogglePayload! @field(resolver: "App\\GraphQL\\Mutations\\Like\\ToggleLike")

    createComment(input: CreateCommentInput!): CommentPayload! @field(resolver: "App\\GraphQL\\Mutations\\Comment\\CreateComment")
    deleteComment(comment_id: ID!): CommentPayload! @field(resolver: "App\\GraphQL\\Mutations\\Comment\\DeleteComment")

    toggleFollow(followed_id: ID!): TogglePayload! @field(resolver: "App\\GraphQL\\Mutations\\Follow\\ToggleFollow")
}

